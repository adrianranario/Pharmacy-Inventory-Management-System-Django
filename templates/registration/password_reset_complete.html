{% extends 'base.html' %}
{% block title %}Password updated - Pharmacy IMS{% endblock %}
{% block auth_content %}
<div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-background via-background to-emerald-50/40 px-4 py-10">
    <div class="w-full max-w-sm">
        <div class="card">
            <div class="card-content space-y-4 py-8 text-center">
                <span class="mx-auto flex h-11 w-11 items-center justify-center rounded-full bg-emerald-100 text-emerald-700">
                    <i class="bi bi-check-lg text-lg"></i>
                </span>
                <h1 class="text-xl font-semibold tracking-tight">Password updated</h1>
                <p class="text-sm text-muted-foreground">Your password has been changed. Sign in with your new password to continue.</p>
                <a href="{% url 'login' %}" class="btn btn-primary w-full">Sign in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
